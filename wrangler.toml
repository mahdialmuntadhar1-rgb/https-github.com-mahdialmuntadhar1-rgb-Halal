name = "halal-api"
main = "src/worker.ts"
compatibility_date = "2026-06-18"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "halal"
database_id = "replace-with-d1-database-id"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "halal-assets"
